name: Port OEM GSI via ErfanGSIsmod

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Direct download URL of the stock ROM (Fastboot, Recovery, or OTA zip)'
        required: true
      rom_type:
        description: 'ROM Type (e.g., Pixel, OxygenOS, MIUI, OneUI, Flyme, ColorOS, Nubia)'
        required: true
        default: 'Pixel'
      target_type:
        description: 'Target partition type'
        required: true
        default: 'AB'
        type: choice
        options:
          - 'AB'
          - 'A'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h

      - name: Install System Dependencies & Pip Wrapper
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 python3-pip python-is-python3 openjdk-11-jdk-headless \
            p7zip-full unace unrar zip unzip simg2img \
            brotli aria2 xz-utils e2fsprogs libfuse-dev
          
          # Create an executable wrapper so any call to 'pip' routes to python3 -m pip
          sudo tee /usr/local/bin/pip > /dev/null << 'EOF'
          #!/usr/bin/env bash
          exec python3 -m pip "$@"
          EOF
          sudo chmod +x /usr/local/bin/pip
          sudo cp -f /usr/local/bin/pip /usr/bin/pip

          sudo python3 -m pip install --upgrade pip
          sudo python3 -m pip install "protobuf>=3.19.0,<3.21.0" pycryptodome wheel setuptools

      - name: Clone Custom GSI Builder & Fix mke2fs Float Division
        run: |
          git clone --recurse-submodules https://github.com/aj750390/ErfanGSIsmod.git GSI-Tool
          cd GSI-Tool
          sudo bash setup.sh

          # Patch mkuserimg_mke2fs across all extensions to enforce integer blocks
          find tools/ -type f -exec sed -i -E 's|/ 4096|// 4096|g' {} +
          find tools/ -type f -exec sed -i -E 's|/ block_size|// block_size|g' {} +
          find tools/ -type f -exec sed -i -E 's|/int\(block_size\)|//int(block_size)|g' {} +
          find tools/ -type f -exec sed -i -E 's|str\(blocks\)|str(int(float(blocks)))|g' {} +
          find tools/ -type f -exec sed -i -E 's|str\(int\(blocks\)\)|str(int(float(blocks)))|g' {} +

          echo "mke2fs integer division patch complete."

      - name: Build GSI
        run: |
          cd GSI-Tool
          sudo -E PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python bash url2GSI.sh \
            "${{ github.event.inputs.rom_url }}" \
            "${{ github.event.inputs.rom_type }}" \
            ":${{ github.event.inputs.target_type }}"

      - name: Fix Permissions & Compress Output Images
        run: |
          sudo chown -R $USER:$USER GSI-Tool/output
          cd GSI-Tool/output
          ls -lh

          # Verify the image was built and is not 0 bytes
          for img in *.img; do
            if [ ! -s "$img" ]; then
              echo "ERROR: $img is 0 bytes. Image creation failed!"
              exit 1
            fi
            echo "Compressing $img..."
            xz -9 -T0 -v "$img"
          done

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.rom_type }}-Android16-GSI
          path: GSI-Tool/output/*.img.xz
          retention-days: 5
