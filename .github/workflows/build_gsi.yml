name: Modern EROFS GSI Builder (Android 15/16)

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Direct ROM / OTA URL (Fastboot, Recovery, or Payload.bin zip)'
        required: true
      rom_type:
        description: 'ROM Type (e.g., Pixel, HyperOS, OxygenOS, OneUI, Motorola)'
        required: true
        default: 'Pixel'
      target_type:
        description: 'Partition layout target'
        required: true
        default: 'AB'
        type: choice
        options:
          - 'AB'
          - 'A'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h

      - name: Install Modern Tooling & EROFS Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 python3-pip python-is-python3 openjdk-11-jdk-headless \
            p7zip-full unace unrar zip unzip simg2img \
            brotli aria2 xz-utils e2fsprogs libfuse-dev \
            erofs-utils curl wget

          # Install standalone high-speed payload-dumper-go
          PAYLOAD_VER="1.2.2"
          wget -q "https://github.com/ssut/payload-dumper-go/releases/download/${PAYLOAD_VER}/payload-dumper-go_${PAYLOAD_VER}_linux_amd64.tar.gz" -O payload-dumper.tar.gz
          tar -xvf payload-dumper.tar.gz payload-dumper-go
          sudo mv payload-dumper-go /usr/local/bin/
          rm -f payload-dumper.tar.gz

      - name: Clone Modern GSI Builder
        run: |
          git clone --recurse-submodules https://github.com/xiaoleGun/Actions-GSI-Builder.git GSI-Tool
          cd GSI-Tool
          sudo bash setup.sh

      - name: Build Android 15/16 GSI
        run: |
          cd GSI-Tool
          sudo bash make.sh \
            "${{ github.event.inputs.rom_url }}" \
            "${{ github.event.inputs.rom_type }}" \
            ":${{ github.event.inputs.target_type }}"

      - name: Compress System Images
        run: |
          cd GSI-Tool/output
          ls -lh
          for img in *.img; do
            if [ -f "$img" ]; then
              echo "Compressing $img..."
              xz -9 -T0 -v "$img"
            fi
          done

      - name: Upload GSI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.rom_type }}-Android16-GSI
          path: GSI-Tool/output/*.img.xz
          retention-days: 5
