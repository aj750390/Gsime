name: Port OEM GSI via ErfanGSIs

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Direct download URL of the stock ROM (Fastboot, Recovery, or OTA zip)'
        required: true
      rom_type:
        description: 'ROM Type (e.g., Pixel, OxygenOS, MIUI, OneUI, Flyme, ColorOS, Nubia)'
        required: true
        default: 'Pixel'
      target_type:
        description: 'Target partition type'
        required: true
        default: 'AB'
        type: choice
        options:
          - 'AB'
          - 'A'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h

      - name: Install System Dependencies & Pip Wrapper
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 python3-pip python-is-python3 openjdk-11-jdk-headless \
            p7zip-full unace unrar zip unzip simg2img \
            brotli aria2 xz-utils e2fsprogs libfuse-dev
          
          # Create an executable wrapper so any call to 'pip' routes to python3 -m pip
          sudo tee /usr/local/bin/pip > /dev/null << 'EOF'
          #!/usr/bin/env bash
          exec python3 -m pip "$@"
          EOF
          sudo chmod +x /usr/local/bin/pip
          sudo cp -f /usr/local/bin/pip /usr/bin/pip

          # Install protobuf system-wide for root
          sudo python3 -m pip install --upgrade pip
          sudo python3 -m pip install "protobuf>=3.19.0,<3.21.0" wheel setuptools

      - name: Clone ErfanGSIs & Patch Version Guard
        run: |
          git clone --recurse-submodules https://github.com/erfanoabdi/ErfanGSIs.git GSI-Tool
          cd GSI-Tool
          sed -i 's/pip /pip3 /g' setup.sh
          sudo bash setup.sh

          # Patch scripts to redirect unsupported versions (Android 14-16) to the base 11 routine
          python3 - << 'EOF'
          import glob, re

          for sh_path in glob.glob("**/*.sh", recursive=True):
              with open(sh_path, "r", errors="ignore") as f:
                  content = f.read()
              
              match = re.search(r'echo\s+["\']?\$(\w+)\s+is not supported', content)
              if match:
                  var_name = match.group(1)
                  print(f"Patching version check for ${var_name} in {sh_path}")
                  patched = re.sub(
                      rf'(case\s+["\']?\$?{var_name}["\']?\s+in)',
                      rf'{var_name}="11"\n\1',
                      content
                  )
                  with open(sh_path, "w") as f:
                      f.write(patched)
          EOF

          # Prevent signing tools from aborting on Android 16 APK signatures
          mkdir -p roms/Pixel
          touch roms/Pixel/DONTRESIGN

      - name: Build GSI
        run: |
          cd GSI-Tool
          sudo -E PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python bash url2GSI.sh \
            "${{ github.event.inputs.rom_url }}" \
            "${{ github.event.inputs.rom_type }}" \
            ":${{ github.event.inputs.target_type }}"

      - name: Compress Output Images
        run: |
          cd GSI-Tool/output
          ls -lh
          for img in *.img; do
            if [ -f "$img" ]; then
              echo "Compressing $img..."
              xz -9 -T0 -v "$img"
            fi
          done

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.rom_type }}-Android16-GSI
          path: GSI-Tool/output/*.img.xz
          retention-days: 5
